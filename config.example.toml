# Example project configuration. Copy it to config.toml (gitignored) and fill in the values marked
# <...>: cp config.example.toml config.toml
#
# Every environment-specific value lives in config.toml; code must not hardcode them.
# Programs find it through the LANCE_CONFIG env var, or by walking up from the current directory.
# deploy/deploy.sh bundles it into the Lambda zip.

[aws]
# Local CLI profile. Ignored inside Lambda, where the execution role is used.
profile = "<aws-cli-profile>"
region = "us-west-2"
account_id = "<aws-account-id>"

[storage]
# S3 Express One Zone directory bucket: <base>--<az_id>--x-s3
bucket = "<bucket-base>--usw2-az1--x-s3"
az_id = "usw2-az1"
# Prefix inside the bucket where tables live: s3://<bucket>/<tables_prefix>/<table>.lance
tables_prefix = "tables"
# Prefix inside the same bucket where clients upload ingest files:
# s3://<bucket>/<staging_prefix>/<table>/<batch_id>/part-0001.arrows
staging_prefix = "staging"

[lambda]
# Two functions from the same zip: control (metadata, small) and ingest (writes, compaction and
# queries, big). Queries have no function of their own: their 30 s limit is enforced inside the
# service ([query] max_timeout_ms), not by the Lambda timeout.
control_function = "<prefix>-lance-control"
ingest_function = "<prefix>-lance-ingest"
# Function URL of ingest (auth NONE, invoke mode RESPONSE_STREAM): the Trino-compatible HTTP API
# for Tableau / DBeaver ([trino]). Only the read-only Trino code is reachable through it; the
# service checks the Basic credential. control has no URL.
ingest_url = "https://<url-id>.lambda-url.us-west-2.on.aws/"
# Execution role of both functions.
role_arn = "arn:aws:iam::<aws-account-id>:role/<lambda-role>"
# The zip exceeds the 50 MB direct upload limit, so it is deployed from S3
# (a general-purpose bucket in the same region; directory buckets can't hold Lambda code).
code_bucket = "<artifacts-bucket>"
code_key = "lance-lambda/function.zip"

[lambda.control]
# Metadata ops: create_table, table_info, list_partitions, get_batch.
memory_mb = 1024
timeout_seconds = 120

[lambda.ingest]
# Writes, compaction and read-only SQL (query / explain), invoked synchronously (for writes the
# response is the commit confirmation). Lambda gives ~1 vCPU per 1769 MB: memory buys CPU.
memory_mb = 4096
timeout_seconds = 900
ephemeral_mb = 2048

[ingest]
# Rows per Arrow record batch inside each uploaded IPC file.
batch_rows = 65536
# Max rows in one write request (= one atomic Lance commit). Partitions are never split.
max_rows_per_request = 1000000
# How long Save/Wait wait for a commit confirmation when the caller sets no deadline.
wait_timeout_seconds = 900

[ledger]
# DynamoDB table with the batch status and the partition registry (hash, time, version).
# pk = <table>; sk = "p#<partition key>" or "b#<batch_id>".
dynamodb_table = "<prefix>-lance-ledger"

[service]
# One writer per table: a lease lock object per table in the data bucket (S3 Express
# conditional writes). Writers renew it while they work; a crashed writer's lease expires.
locks_prefix = "locks"
lock_lease_seconds = 120
# How long a write waits for another writer of the same table before failing with TABLE_BUSY.
lock_wait_seconds = 300
# Old table versions are kept this long (readers mid-query, time travel), then cleaned up.
version_retention_hours = 24
# Batch records in the ledger expire after this many days (DynamoDB TTL).
batch_ttl_days = 30

[query]
# Rows returned when the request sets no max_rows, and the cap on what it may ask for.
default_max_rows = 10000
max_rows_limit = 100000
# Per-query timeout when the request sets none, and the cap a request can ask for. Enforced inside
# the service: the function's own timeout (900 s) is for writes, a query is cut at 30 s.
default_timeout_ms = 30000
max_timeout_ms = 30000
# Rows stop being added once the JSON reaches this size (sync Lambda responses are capped at 6 MB);
# the result is then marked truncated.
max_response_bytes = 5000000
# A cached table is checked for a newer version at most this often. A request that names a
# minimum version for a table (the one Save confirmed) is always checked right away.
freshness_seconds = 5
# DataFusion memory pool as a fraction of the function memory (sorts/joins spill to /tmp beyond it).
memory_fraction = 0.6
# Result cache in the data bucket: s3://<bucket>/<cache_prefix>/query/<sha256>.json, one object per
# (sql, max_rows). A query whose result is younger than its cache_seconds is answered from it
# without running. cache_seconds: 0 = cache_default_seconds, -1 = no cache (neither read nor
# written), > 0 = that age, capped at cache_max_seconds. setup.sh expires the prefix after 1 day.
cache_prefix = "cache"
cache_default_seconds = 300
cache_max_seconds = 86400

[trino]
# Trino-compatible HTTP API on the ingest Function URL (trino-api-plan.md), for Tableau / DBeaver.
# A single read-only credential: Basic auth with this user and key (config.toml is gitignored, but
# it goes into the Lambda zip). Use a random key:
#   openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'
# An empty key rejects every request.
user = "tableau"
password = ""
catalog = "lance"
schema = "default"
# Reported by version() and /v1/info.
server_version = "476"
# Caps per response; a result that reaches any of them is cut, with a RESULT_TRUNCATED warning.
max_rows = 1000000
max_result_mb = 100
# Whole response (execution + sending). The first row must still be ready within
# query.max_timeout_ms.
max_stream_seconds = 300

[compaction]
# Defaults for the "compact" op when the request leaves a limit at 0. A group of adjacent
# small files is merged into one file while it stays within BOTH limits.
max_file_mb = 50
max_files = 20
# Max groups rewritten per invocation, so one run fits in the Lambda timeout;
# call again until the result reports no remaining work.
max_tasks = 10

[spikes.a]
# Prefix inside the bucket for Spike A runs: s3://<bucket>/<prefix>/run-<ts>/
prefix = "spike-a"
rows_per_batch = 10000
concurrent_writers = 4

[spikes.partitions]
# Atomic partition replace: delete + insert of whole partitions in one Lance commit.
prefix = "spike-partitions"
rows_per_partition = 2000

[spikes.compaction]
# End-to-end compaction run: many small appends, then compaction with a concurrent append.
# Limits are small on purpose so a few MB of test data produces several groups.
prefix = "spike-compaction"
appends = 10
rows_per_append = 5000
max_file_mb = 1
max_files = 4
max_tasks = 10
